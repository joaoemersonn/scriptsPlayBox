services:
  playbox-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playbox-scheduler
    restart: unless-stopped
    networks:
      - whatsapp-net
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - APP_DATA_DIR=/app/data
      - SCHEDULE_TIMEZONE=America/Sao_Paulo

      # Servidor WhatsApp Local (BotWhatsApp Baileys no container whatsapp_bot)
      - WHATSAPP_HOST=${WHATSAPP_HOST:-whatsapp-bot}
      - WHATSAPP_PORT=${WHATSAPP_PORT:-3035}
      - WHATSAPP_BASE_URL=${WHATSAPP_BASE_URL:-http://whatsapp-bot:3035}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY:-}
      - WHATSAPP_SEND_PATH=${WHATSAPP_SEND_PATH:-/api/messages/send}
      - WHATSAPP_MONITOR_CHAT_ID=${WHATSAPP_MONITOR_CHAT_ID:-}
      - WHATSAPP_REPORT_CHAT_ID=${WHATSAPP_REPORT_CHAT_ID:-}
      - WHATSAPP_ESTOQUE_CHAT_ID=${WHATSAPP_ESTOQUE_CHAT_ID:-${WHATSAPP_REPORT_CHAT_ID:-}}
      - WHATSAPP_COLETA_CHAT_ID=${WHATSAPP_COLETA_CHAT_ID:-${WHATSAPP_REPORT_CHAT_ID:-}}

      # Chave de API para autenticação nos métodos da aplicação (Swagger / API REST)
      - APP_API_KEY=${APP_API_KEY:-playbox_secure_api_key_2026}

      # Autenticação de Acesso ao Painel Web
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-PlayBox@2026!}

      # Schedulers (cron format: second minute hour day-of-month month day-of-week)
      # Schedule monitor: every 5 minutes
      - SCHEDULE_MONITOR_CRON=${SCHEDULE_MONITOR_CRON:-0 */5 * * * *}
      # Schedule 24h report: daily at 00:00
      - SCHEDULE_REPORT_24H_CRON=${SCHEDULE_REPORT_24H_CRON:-0 0 0 * * *}
      # Schedule 12h report: disabled
      - SCHEDULE_REPORT_12H_ENABLED=${SCHEDULE_REPORT_12H_ENABLED:-false}
      # Schedule month report: daily at 08:00
      - SCHEDULE_REPORT_MES_CRON=${SCHEDULE_REPORT_MES_CRON:-0 0 8 * * *}
      # Schedule estoque alerta: daily at 18:20
      - SCHEDULE_ESTOQUE_ALERTA_CRON=${SCHEDULE_ESTOQUE_ALERTA_CRON:-0 20 18 * * *}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  ngrok:
    image: ngrok/ngrok:latest
    container_name: playbox-ngrok
    restart: unless-stopped
    networks:
      - whatsapp-net
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
      - NGROK_DOMAIN=${NGROK_DOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ -z "$$NGROK_AUTHTOKEN" ] || [ -z "$$NGROK_DOMAIN" ]; then
          echo "[NGROK] NGROK_AUTHTOKEN ou NGROK_DOMAIN ainda nao configurados no .env. Tunel aguardando configuracao...";
          while true; do sleep 3600; done;
        else
          echo "[NGROK] Iniciando tunel ngrok para playbox-scheduler:8080 com dominio estatico $$NGROK_DOMAIN...";
          exec /bin/ngrok http playbox-scheduler:8080 --url="$$NGROK_DOMAIN";
        fi

networks:
  whatsapp-net:
    name: whatsapp-net
    external: true
